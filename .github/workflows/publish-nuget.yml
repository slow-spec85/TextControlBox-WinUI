name: Publish NuGet package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-nuget-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  PACKAGE_OUTPUT: ${{ github.workspace }}\artifacts\nuget

jobs:
  build_and_validate:
    name: Build and validate tagged package
    if: github.repository == 'slow-spec85/TextControlBox-WinUI'
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      is_release: ${{ steps.release.outputs.is_release }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve release context
        id: release
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -ne "push") {
              "is_release=false" >> $env:GITHUB_OUTPUT
              "version=" >> $env:GITHUB_OUTPUT
              Write-Host "Manual run: package publication is disabled."
              exit 0
          }

          $tagRef = "refs/tags/${{ github.ref_name }}"
          git fetch origin "+${tagRef}:${tagRef}" --no-tags --force
          if ($LASTEXITCODE -ne 0) {
              throw "Failed to restore annotated release tag '$tagRef'."
          }

          $tagObjectType = (git cat-file -t $tagRef).Trim()
          if ($LASTEXITCODE -ne 0 -or $tagObjectType -ne "tag") {
              throw "Release tag '${{ github.ref_name }}' must be an annotated tag so its annotation can be used as GitHub Release notes."
          }

          git fetch origin "refs/heads/master:refs/remotes/origin/master" --no-tags --force
          if ($LASTEXITCODE -ne 0) {
              throw "Failed to fetch public master."
          }

          $taggedCommit = (git rev-parse HEAD).Trim()
          $masterCommit = (git rev-parse refs/remotes/origin/master).Trim()
          $version = powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass `
              -File ".\TextControlBox\Build\ResolveTextControlBoxRelease.ps1" `
              -Tag "${{ github.ref_name }}" `
              -TaggedCommit $taggedCommit `
              -MasterCommit $masterCommit

          if ($LASTEXITCODE -ne 0) {
              throw "Release tag validation failed with exit code $LASTEXITCODE."
          }

          $version = "$version".Trim()
          "is_release=true" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Validated release $version at $taggedCommit."

      - name: Run release tag validator regression checks
        shell: pwsh
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass `
              -File ".\TextControlBox.Tests\Build\ReleaseTagValidatorTests.ps1"

          if ($LASTEXITCODE -ne 0) {
              throw "Release tag validator regression checks failed with exit code $LASTEXITCODE."
          }

      - name: Restore x64 solution
        run: dotnet restore TextControlBox-WinUI.sln -p:Platform=x64

      - name: Build library and test project
        run: dotnet build TextControlBox-WinUI.sln --configuration Release -p:Platform=x64 --no-restore

      - name: Run packaged WinUI tests
        shell: pwsh
        run: |
          .\TextControlBox.Tests\Build\RunWinUITests.ps1 `
              -Configuration Release `
              -Platform x64 `
              -NoBuild `
              -ResultsDirectory "${{ github.workspace }}\TestResults"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: textcontrolbox-test-results-${{ github.sha }}
          path: ${{ github.workspace }}\TestResults\*.trx
          if-no-files-found: ignore
          retention-days: 30

      - name: Pack library
        run: dotnet pack TextControlBox\TextControlBox.csproj --configuration Release -p:Platform=x64 --no-build --output "${{ env.PACKAGE_OUTPUT }}"

      - name: Validate package
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -LiteralPath "${{ env.PACKAGE_OUTPUT }}" -Filter "*.nupkg")
          if ($packages.Count -ne 1) {
              throw "Expected exactly one .nupkg; found $($packages.Count)."
          }

          $validatorArguments = @(
              "-NoProfile",
              "-NonInteractive",
              "-ExecutionPolicy", "Bypass",
              "-File", ".\TextControlBox\Build\ValidateTextControlBoxPackage.ps1",
              "-PackagePath", $packages[0].FullName
          )

          if ("${{ steps.release.outputs.is_release }}" -eq "true") {
              $validatorArguments += @("-ExpectedVersion", "${{ steps.release.outputs.version }}")
          }

          powershell.exe @validatorArguments
          if ($LASTEXITCODE -ne 0) {
              throw "Package validation failed with exit code $LASTEXITCODE."
          }

      - name: Upload validated package
        uses: actions/upload-artifact@v4
        with:
          name: textcontrolbox-nuget-${{ github.sha }}
          path: ${{ env.PACKAGE_OUTPUT }}\*.nupkg
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish package to NuGet.org
    needs: build_and_validate
    if: github.repository == 'slow-spec85/TextControlBox-WinUI' && needs.build_and_validate.outputs.is_release == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    environment: nuget

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Download validated package
        uses: actions/download-artifact@v4
        with:
          name: textcontrolbox-nuget-${{ github.sha }}
          path: artifacts\nuget

      - name: Get temporary NuGet API key
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish package
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -LiteralPath "artifacts\nuget" -Filter "*.nupkg")
          if ($packages.Count -ne 1) {
              throw "Expected exactly one .nupkg; found $($packages.Count)."
          }

          dotnet nuget push $packages[0].FullName `
              --source "https://api.nuget.org/v3/index.json" `
              --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" `
              --skip-duplicate

          if ($LASTEXITCODE -ne 0) {
              throw "NuGet publication failed with exit code $LASTEXITCODE."
          }

  github_release:
    name: Create GitHub Release
    needs:
      - build_and_validate
      - publish
    if: github.repository == 'slow-spec85/TextControlBox-WinUI' && needs.build_and_validate.outputs.is_release == 'true'
    runs-on: windows-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download published package
        uses: actions/download-artifact@v4
        with:
          name: textcontrolbox-nuget-${{ github.sha }}
          path: artifacts\nuget

      - name: Create release from annotated tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = "${{ needs.build_and_validate.outputs.version }}"
          $packages = @(Get-ChildItem -LiteralPath "artifacts\nuget" -Filter "*.nupkg")
          if ($packages.Count -ne 1) {
              throw "Expected exactly one .nupkg; found $($packages.Count)."
          }

          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
              Write-Host "GitHub Release '$tag' already exists; refreshing its package asset."
              gh release upload $tag $packages[0].FullName --clobber
          }
          else {
              $releaseArguments = @(
                  "release", "create", $tag,
                  $packages[0].FullName,
                  "--verify-tag",
                  "--title", $tag,
                  "--notes-from-tag"
              )

              if ($version.Contains("-")) {
                  $releaseArguments += "--prerelease"
              }

              gh @releaseArguments
          }

          if ($LASTEXITCODE -ne 0) {
              throw "GitHub Release creation failed with exit code $LASTEXITCODE."
          }
